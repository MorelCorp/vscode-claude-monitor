name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag, e.g. v0.2.0. Leave blank to just build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # Only a release build (tag push, or a manual run naming release_tag) gets its
      # version stamped from the tag; a plain branch/PR build packages whatever
      # version is already committed in package.json.
      - name: Set version from the release tag
        env:
          TAG: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag) ||
                (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        if: env.TAG != ''
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      - run: npm run package
      # Downloadable from the run's summary page for ~90 days. Every branch and
      # PR gets one, so a build can be tried out before it is ever tagged.
      - uses: actions/upload-artifact@v7
        with:
          name: claude-usage-monitor-vsix
          path: '*.vsix'
          if-no-files-found: error

  # Publish that same VSIX as a permanent release asset. Either push a v* tag,
  # or start this workflow by hand and name the tag — the manual path creates
  # the tag itself, for anyone who cannot push one.
  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: claude-usage-monitor-vsix
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # A tag push already names the tag; a manual run supplies it.
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.vsix --clobber
          else
            # Anchor the tag to the commit that was actually built and tested.
            gh release create "$TAG" ./*.vsix \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
