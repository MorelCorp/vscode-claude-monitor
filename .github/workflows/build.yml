name: Build

on:
  push:
    branches: ['**']
    # 'v1.2.3' is the convention; a bare '1.2.3' is accepted too, so a mistyped tag
    # fails loudly in the release job rather than silently building nothing.
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release by bumping package.json this much. "none" just builds.'
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # A release run pushes the version bump it makes back to the branch it ran from.
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

      # Where the release version comes from, and why it cannot drift:
      #
      #   manual run  - npm version bumps package.json, COMMITS it, and creates the
      #                 matching tag; both are pushed before anything is packaged.
      #   tag push    - the tag was made by `npm version` locally, so the commit it
      #                 points at already carries the right version.
      #   otherwise   - no tag, no release, and the VSIX is named after whatever is
      #                 committed.
      #
      # The old manual path stamped the version onto the build with
      # --no-git-tag-version and never committed it, which is why package.json sat
      # behind every release published from this button.
      - name: Bump, commit and tag the release
        id: tag
        env:
          BUMP: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || 'none' }}
        run: |
          set -euo pipefail
          if [ "$BUMP" != none ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            TAG=$(npm version "$BUMP" -m 'release %s' | tail -1)
            git push origin "HEAD:$GITHUB_REF_NAME" --follow-tags
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
          else
            TAG=''
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A tag pushed by hand can still disagree with package.json. Fail here rather
      # than publish a VSIX whose name does not match the source it was built from.
      - name: Check the tag matches package.json
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          HAVE=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$HAVE" ]; then
            echo "::error::Tag $TAG does not match package.json $HAVE." \
                 "Run 'npm version' and tag the commit it makes."
            exit 1
          fi

      - run: npm run package
      # Downloadable from the run's summary page for ~90 days. Every branch and
      # PR gets one, so a build can be tried out before it is ever tagged.
      - uses: actions/upload-artifact@v7
        with:
          name: claude-usage-monitor-vsix
          path: '*.vsix'
          if-no-files-found: error

  # Publish that same VSIX as a permanent release asset, against the tag the build
  # job settled on. The tag always exists in the repository by this point.
  release:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: claude-usage-monitor-vsix
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.vsix --clobber
          else
            gh release create "$TAG" ./*.vsix --title "$TAG" --generate-notes
          fi
